# =============================================================================
# Nginx - Reverse Proxy para o Order System (subdomínios)
# Copiar para: /etc/nginx/conf.d/order-system.conf
# =============================================================================

# ─────────────────────────────────────────────────────────────
# web.foodtruck.app.br — Painel Web (arquivos estáticos)
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name web.foodtruck.app.br foodtruck.app.br;

    # Imagens dos tenants (proxy para S3)
    # NOTA: usa /tenant-assets/ e NÃO /assets/. O build do Vite gera os bundles
    # do painel (JS/CSS) em /assets/*, então um proxy em /assets/ sequestraria
    # esses arquivos e o S3 responderia 403 (XML) — quebrando o carregamento do
    # painel. Mantenha imagens de tenant em /tenant-assets/.
    location /tenant-assets/ {
        proxy_pass https://order-system-assets-702872201713.s3.us-east-1.amazonaws.com/;
        proxy_set_header Host order-system-assets-702872201713.s3.us-east-1.amazonaws.com;
        proxy_set_header Authorization "";
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-meta-server-side-encryption;
        proxy_hide_header x-amz-server-side-encryption;
        proxy_intercept_errors on;

        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        root /opt/order-system/apps/web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    client_max_body_size 10M;
}

# ─────────────────────────────────────────────────────────────
# order.foodtruck.app.br — PWA do Operador
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name order.foodtruck.app.br;

    location / {
        root /opt/order-system/apps/mobile/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Service Worker — não cachear agressivamente
    location = /sw.js {
        root /opt/order-system/apps/mobile/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Manifest
    location = /manifest.json {
        root /opt/order-system/apps/mobile/dist;
        add_header Cache-Control "no-cache";
    }

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    client_max_body_size 10M;
}

# ─────────────────────────────────────────────────────────────
# api.foodtruck.app.br — Backend API + Auth + Realtime
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.foodtruck.app.br;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase Auth (Kong gateway)
    location /auth/ {
        proxy_pass http://127.0.0.1:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase Realtime (WebSocket)
    location /realtime/ {
        proxy_pass http://127.0.0.1:8000/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10M;
}
