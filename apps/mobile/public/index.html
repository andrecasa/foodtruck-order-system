<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- PWA -->
    <!--
      Limitação conhecida (R9): o manifest é único e global, com start_url "/" e
      short_name do operador. Um cliente que "instalar" a partir de /:slug reabrirá
      em / (login do operador), não no cardápio. Aceitável no escopo inicial, pois o
      cliente acessa por QR/link e raramente instala. Evolução futura: manifest
      dinâmico ou start_url por contexto (fora de escopo).
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2C6E9B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Operador" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!-- Service Worker registration -->
    <script>
      (function () {
        // In development (Expo dev server / Metro on port 8081), do NOT register
        // the service worker: Metro's HMR must serve the freshest bundle
        // directly, so any SW (even stale-while-revalidate, which still serves
        // the previous bundle on the first load) gets in the way. Also
        // proactively unregister any SW already installed from a previous
        // session and drop its caches (including the legacy "operador-v1"), so
        // developers are never stuck on an old bundle. In production the SW is
        // registered and uses stale-while-revalidate (see sw.js).
        var host = window.location.hostname;
        var port = window.location.port;
        var isDev =
          port === '8081' ||
          host === 'localhost' ||
          host === '127.0.0.1' ||
          /^192\.168\./.test(host) ||
          /^10\./.test(host);

        if ('serviceWorker' in navigator) {
          if (isDev) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                reg.unregister();
              });
            });
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                keys.forEach(function (key) {
                  caches.delete(key);
                });
              });
            }
          } else {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('/sw.js').then(function (reg) {
                console.log('SW registered:', reg.scope);
              });
            });
          }
        }
      })();
    </script>
  </body>
</html>
