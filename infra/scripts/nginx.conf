# =============================================================================
# Nginx - Reverse Proxy para o Order System
# Copiar para: /etc/nginx/conf.d/order-system.conf
# =============================================================================

# Redirecionar HTTP para HTTPS (ativar após certbot)
# server {
#     listen 80;
#     server_name seu-dominio.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl;  # Descomente após certbot
    server_name _;    # Substituir pelo domínio real

    # SSL (gerado pelo certbot)
    # ssl_certificate /etc/letsencrypt/live/seu-dominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com/privkey.pem;

    # ─────────────────────────────────────────
    # Backend API
    # ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────────
    # Supabase Auth (Kong gateway)
    # ─────────────────────────────────────────
    location /auth/ {
        proxy_pass http://127.0.0.1:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────────
    # Supabase Realtime (WebSocket)
    # ─────────────────────────────────────────
    location /realtime/ {
        proxy_pass http://127.0.0.1:8000/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ─────────────────────────────────────────
    # Painel Web (build estático servido pelo Nginx)
    # ─────────────────────────────────────────
    location / {
        root /opt/order-system/apps/web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache de assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─────────────────────────────────────────
    # Gzip
    # ─────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ─────────────────────────────────────────
    # Segurança básica
    # ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limitar tamanho do upload (para webhook do WhatsApp)
    client_max_body_size 10M;
}
